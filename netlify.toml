[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Deep links such as /search or /calendar/day/2026-09-20 open the app instead of a not-found page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must always be fetched fresh so updates are noticed.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
